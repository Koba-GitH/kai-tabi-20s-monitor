name: Monitor KAI Tabi 20s

on:
  schedule:
    - cron: "2-59/5 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoshino-kai-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check availability and notify Discord
        env:
          DISCORD_WEBHOOK_URL_HOSHINO: ${{ secrets.DISCORD_WEBHOOK_URL_HOSHINO }}
        run: python -m src.hoshino_scraper.main

      - name: Persist changed availability state
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- state/availability.json)" ]]; then
            echo "Availability state did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/availability.json
          git commit -m "chore: update availability state [skip ci]"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
